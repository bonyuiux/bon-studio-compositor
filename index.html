<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bon Studio — Content Compositor</title>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Jost:wght@300;400;500&family=DM+Sans:ital,wght@0,300;0,400;1,300&family=La+Belle+Aurore&family=Bilbo+Swash+Caps&family=Bodoni+Moda:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F5F3F0;
    --ink: #111111;
    --walnut: #614E3A;
    --deep-brown: #452900;
    --mist: #9A9490;
    --stone: #C8C5BE;
    --white: #FFFFFF;
    /* New colors for text modes */
    --yellow: #F1C76D;
    --orange: #DB7442;
    --dark-red: #BC3B3B;
    /* Theme colors */
    --bg-dark: #1A1714;
    --bg-light: #F5F3F0;
    --text-dark: #111111;
    --text-light: #F5F3F0;
  }

  /* Light theme */
  body.light-theme {
    --bg-dark: #F5F3F0;
    --bg-light: #1A1714;
  }

  body {
    background: var(--bg-dark);
    color: var(--cream);
    font-family: 'Jost', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }

  body.light-theme {
    color: var(--ink);
    background: #F5EDDF;
  }

  header {
    padding: 22px 40px 18px;
    border-bottom: 1px solid rgba(245,243,240,0.08);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-shrink: 0;
    transition: border-color 0.3s;
  }

  body.light-theme header {
    border-bottom-color: rgba(17,17,17,0.08);
    background: #F5EDDF;
  }

  header .logo { font-family: 'Italiana', serif; font-size: 22px; color: var(--cream); letter-spacing: 0.02em; transition: color 0.3s; }
  body.light-theme header .logo { color: var(--ink); }

  header .subtitle { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mist); font-weight: 300; }
  header .version { margin-left: auto; font-size: 9px; letter-spacing: 0.15em; color: rgba(154,148,144,0.5); }

  /* Theme toggle — moon/sun slider */
  .theme-toggle {
    margin-left: auto;
    display: flex;
    align-items: center;
  }

  .theme-toggle .checkbox { opacity: 0; position: absolute; }

  .checkbox-label {
    background-color: #111;
    width: 42px;
    height: 22px;
    border-radius: 50px;
    position: relative;
    padding: 4px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color 0.3s;
  }

  body.light-theme .checkbox-label {
    background-color: #D4C5A9;
  }

  .checkbox-label .toggle-icon { font-size: 11px; }
  .checkbox-label .toggle-icon:nth-child(1) { color: #f1c40f; }
  .checkbox-label .toggle-icon:nth-child(2) { color: #f39c12; }

  .checkbox-label .ball {
    background-color: #fff;
    width: 16px;
    height: 16px;
    position: absolute;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    transition: transform 0.2s linear;
  }

  .checkbox:checked + .checkbox-label .ball { transform: translateX(20px); }

  .app { display: grid; grid-template-columns: 360px 1fr; flex: 1; min-height: 0; }

  .sidebar {
    border-right: 1px solid rgba(245,243,240,0.08);
    padding: 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    transition: border-color 0.3s, background 0.3s;
  }

  body.light-theme .sidebar {
    border-right-color: rgba(17,17,17,0.08);
    background: #F5EDDF;
  }

  .section-label {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--mist); font-weight: 500; margin-bottom: 10px;
  }

  /* ── Upload zone ── */
  .upload-zone {
    display: block;
    border: 1px dashed rgba(245,243,240,0.2); border-radius: 6px;
    padding: 22px 16px; text-align: center; cursor: pointer;
    transition: border-color 0.2s, background 0.2s; position: relative;
    user-select: none;
  }

  body.light-theme .upload-zone {
    border-color: rgba(17,17,17,0.1);
  }

  .upload-zone:hover, .upload-zone.drag-over { border-color: rgba(245,243,240,0.5); background: rgba(245,243,240,0.03); }

  body.light-theme .upload-zone:hover, body.light-theme .upload-zone.drag-over {
    border-color: rgba(17,17,17,0.3);
    background: rgba(17,17,17,0.02);
  }

  .upload-zone .upload-icon { font-size: 24px; margin-bottom: 8px; opacity: 0.35; }
  .upload-zone p { font-size: 11px; color: var(--mist); font-weight: 300; }
  .upload-zone .file-name { font-size: 11px; color: var(--cream); margin-top: 5px; word-break: break-all; transition: color 0.3s; }

  body.light-theme .upload-zone .file-name { color: var(--ink); }

  /* ── Format ── */
  .format-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .format-btn {
    background: rgba(245,243,240,0.05); border: 1px solid rgba(245,243,240,0.1);
    border-radius: 4px; padding: 9px 4px; text-align: center; cursor: pointer;
    transition: all 0.15s; color: var(--mist); font-family: 'Jost', sans-serif;
    font-size: 9px; letter-spacing: 0.06em; font-weight: 400;
  }

  body.light-theme .format-btn {
    background: rgba(17,17,17,0.03);
    border-color: rgba(17,17,17,0.08);
  }

  .format-btn.active { background: rgba(97,78,58,0.3); border-color: var(--walnut); color: var(--cream); transition: all 0.15s; }

  body.light-theme .format-btn.active {
    background: rgba(97,78,58,0.15);
    color: var(--walnut);
  }

  .format-btn .ratio { font-size: 13px; display: block; margin-bottom: 3px; font-family: 'Italiana', serif; }

  /* ── Layout grid — 3×2 ── */
  .layout-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .layout-btn {
    background: rgba(245,243,240,0.04); border: 1px solid rgba(245,243,240,0.1);
    border-radius: 4px; padding: 9px 5px; cursor: pointer; text-align: center;
    transition: all 0.15s; font-family: 'Jost', sans-serif; font-size: 9px;
    color: var(--mist); letter-spacing: 0.04em;
  }

  body.light-theme .layout-btn {
    background: rgba(17,17,17,0.02);
    border-color: rgba(17,17,17,0.08);
  }

  .layout-btn:hover { border-color: rgba(245,243,240,0.3); }

  body.light-theme .layout-btn:hover {
    border-color: rgba(17,17,17,0.2);
  }

  .layout-btn.active { background: rgba(97,78,58,0.25); border-color: var(--walnut); color: var(--cream); }

  body.light-theme .layout-btn.active {
    background: rgba(97,78,58,0.12);
    color: var(--walnut);
  }

  .layout-btn .thumb {
    width: 100%; aspect-ratio: 1; border: 1px solid rgba(245,243,240,0.12);
    border-radius: 2px; margin-bottom: 6px; position: relative;
    overflow: hidden; background: rgba(245,243,240,0.04);
  }

  body.light-theme .layout-btn .thumb {
    border-color: rgba(17,17,17,0.08);
    background: rgba(17,17,17,0.02);
  }

  .layout-btn .tl { position: absolute; background: rgba(245,243,240,0.35); border-radius: 1px; }

  /* ── Font Style Tabs ── */
  .font-style-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-bottom: 12px;
  }

  .font-style-tab {
    background: rgba(245,243,240,0.04);
    border: 1px solid rgba(245,243,240,0.1);
    border-radius: 4px;
    padding: 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--mist);
    font-family: 'Jost', sans-serif;
    font-size: 9px;
    letter-spacing: 0.06em;
  }

  body.light-theme .font-style-tab {
    background: rgba(17,17,17,0.03);
    border-color: rgba(17,17,17,0.08);
  }

  .font-style-tab:hover {
    border-color: rgba(245,243,240,0.3);
  }

  body.light-theme .font-style-tab:hover {
    border-color: rgba(17,17,17,0.2);
  }

  .font-style-tab.active {
    background: rgba(97,78,58,0.3);
    border-color: var(--walnut);
    color: var(--cream);
  }

  body.light-theme .font-style-tab.active {
    background: rgba(97,78,58,0.15);
    color: var(--walnut);
  }

  .font-style-tab .font-name {
    display: block;
    font-size: 10px;
    font-weight: 500;
  }

  /* ── Text fields ── */
  .field-group { display: flex; flex-direction: column; gap: 9px; }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-row label { font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mist); font-weight: 500; }
  .field-row input, .field-row textarea, .field-row select {
    background: rgba(245,243,240,0.05); border: 1px solid rgba(245,243,240,0.12);
    border-radius: 4px; color: var(--cream); font-family: 'Jost', sans-serif;
    font-size: 13px; font-weight: 300; padding: 8px 11px; outline: none;
    transition: border-color 0.15s; resize: none; width: 100%;
  }

  body.light-theme .field-row input,
  body.light-theme .field-row textarea,
  body.light-theme .field-row select {
    background: rgba(17,17,17,0.04);
    border-color: rgba(17,17,17,0.1);
    color: var(--ink);
  }

  .field-row input:focus, .field-row textarea:focus, .field-row select:focus { border-color: rgba(245,243,240,0.35); }

  body.light-theme .field-row input:focus,
  body.light-theme .field-row textarea:focus,
  body.light-theme .field-row select:focus {
    border-color: rgba(17,17,17,0.25);
  }

  .field-row select option { background: #2A2420; }

  body.light-theme .field-row select option {
    background: #F5F3F0;
    color: var(--ink);
  }

  /* ── Text Color Swatches ── */
  .color-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .color-swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: border-color 0.15s; }
  .color-swatch.active { border-color: var(--cream); }

  body.light-theme .color-swatch.active {
    border-color: var(--ink);
  }

  /* ── Global Text Controls ── */
  .text-control-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .text-control-row label { font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mist); white-space: nowrap; min-width: 60px; }
  .text-control-row input[type=range] { flex: 1; accent-color: var(--walnut); }
  .text-control-val { font-size: 10px; color: var(--mist); min-width: 35px; text-align: right; }

  /* ── Watermark section ── */
  .watermark-row { display: flex; gap: 7px; align-items: center; margin-bottom: 10px; }
  .wm-upload-btn {
    flex: 1; background: rgba(245,243,240,0.05); border: 1px dashed rgba(245,243,240,0.2);
    border-radius: 4px; padding: 8px 10px; font-size: 10px; color: var(--mist);
    font-family: 'Jost', sans-serif; cursor: pointer; text-align: center;
    transition: all 0.15s; letter-spacing: 0.06em; position: relative;
  }

  body.light-theme .wm-upload-btn {
    background: rgba(17,17,17,0.03);
    border-color: rgba(17,17,17,0.1);
  }

  .wm-upload-btn:hover { border-color: rgba(245,243,240,0.4); color: var(--cream); }

  body.light-theme .wm-upload-btn:hover {
    border-color: rgba(17,17,17,0.25);
    color: var(--ink);
  }

  .wm-upload-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .wm-preview { width: 48px; height: 32px; border: 1px solid rgba(245,243,240,0.12); border-radius: 3px; background: rgba(245,243,240,0.04); display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }

  body.light-theme .wm-preview {
    border-color: rgba(17,17,17,0.08);
    background: rgba(17,17,17,0.02);
  }

  .wm-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .wm-clear-btn { background: none; border: none; color: var(--mist); cursor: pointer; font-size: 14px; padding: 4px; transition: color 0.15s; flex-shrink: 0; }
  .wm-clear-btn:hover { color: var(--cream); }

  body.light-theme .wm-clear-btn:hover {
    color: var(--ink);
  }

  /* Watermark position — 3 buttons: L / C / R */
  .wm-pos-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .wm-pos-btn {
    background: rgba(245,243,240,0.04); border: 1px solid rgba(245,243,240,0.1);
    border-radius: 4px; padding: 6px; font-size: 9px; color: var(--mist);
    font-family: 'Jost', sans-serif; cursor: pointer; text-align: center;
    transition: all 0.15s; letter-spacing: 0.04em;
  }

  body.light-theme .wm-pos-btn {
    background: rgba(17,17,17,0.02);
    border-color: rgba(17,17,17,0.08);
  }

  .wm-pos-btn.active { background: rgba(97,78,58,0.25); border-color: var(--walnut); color: var(--cream); }

  body.light-theme .wm-pos-btn.active {
    background: rgba(97,78,58,0.12);
    color: var(--walnut);
  }

  /* Watermark size slider */
  .wm-size-row { display: flex; align-items: center; gap: 10px; }
  .wm-size-row label { font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--mist); white-space: nowrap; }
  .wm-size-row input[type=range] { flex: 1; accent-color: var(--walnut); }
  .wm-size-val { font-size: 10px; color: var(--mist); min-width: 28px; text-align: right; }

  /* ── Export ── */
  .export-btn {
    background: var(--walnut); border: none; border-radius: 4px; color: var(--cream);
    font-family: 'Jost', sans-serif; font-size: 11px; letter-spacing: 0.14em;
    text-transform: uppercase; font-weight: 500; padding: 13px; cursor: pointer;
    width: 100%; transition: background 0.15s;
  }
  .export-btn:hover { background: #7A6248; }
  .export-status { font-size: 11px; color: var(--mist); letter-spacing: 0.06em; text-align: center; min-height: 16px; }

  /* ── Carousel ── */
  .slide-actions { display: flex; gap: 7px; }
  .slide-action-btn {
    background: rgba(245,243,240,0.05); border: 1px solid rgba(245,243,240,0.12);
    border-radius: 4px; color: var(--mist); font-family: 'Jost', sans-serif;
    font-size: 10px; padding: 5px 11px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.06em;
  }

  body.light-theme .slide-action-btn {
    background: rgba(17,17,17,0.03);
    border-color: rgba(17,17,17,0.08);
  }

  .slide-action-btn:hover { border-color: rgba(245,243,240,0.3); color: var(--cream); }

  body.light-theme .slide-action-btn:hover {
    border-color: rgba(17,17,17,0.2);
    color: var(--ink);
  }

  /* ── Canvas area ── */
  .canvas-area {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 32px; padding-top: 40px; gap: 16px; background: #0F0D0B; transition: background 0.3s;
    position: sticky; top: 0; height: 100vh; overflow: auto;
  }

  body.light-theme .canvas-area {
    background: #F5EDDF;
  }

  .canvas-wrapper { position: relative; }

  /* Live preview — a real canvas drawn by drawComposition(), the SAME fn as export.
     The canvas internal resolution is the full export size (1080×…); we scale it
     down for display with CSS so 1 preview px === 1 export px proportionally. */
  #preview {
    display: block;
    background: var(--cream);
    /* width/height set inline by JS to the DISPLAY size; internal res set via attributes */
  }

  /* Text block — positioned by JS classes (legacy, no longer used for canvas) */
  #preview-content { display: none; }

  /* Carousel nav */
  .carousel-nav { display: flex; align-items: center; gap: 10px; }
  .slide-dots { display: flex; gap: 5px; }
  .slide-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(245,243,240,0.2); cursor: pointer; transition: background 0.15s; border: none; }
  .slide-dot.active { background: var(--cream); }
  .nav-arrow {
    background: rgba(245,243,240,0.08); border: 1px solid rgba(245,243,240,0.15);
    border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; color: var(--cream); font-size: 14px; transition: background 0.15s;
  }
  .nav-arrow:hover { background: rgba(245,243,240,0.15); }
  .nav-arrow:disabled { opacity: 0.3; pointer-events: none; }
  .slide-info { font-size: 10px; color: var(--mist); letter-spacing: 0.06em; }

  .divider { height: 1px; background: rgba(245,243,240,0.07); margin: 2px 0; }

  body.light-theme .divider {
    background: rgba(17,17,17,0.07);
  }

  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(245,243,240,0.1); border-radius: 2px; }

  body.light-theme .sidebar::-webkit-scrollbar-thumb {
    background: rgba(17,17,17,0.1);
  }

  /* ── Crop overlay (shown over preview when photo loaded) ── */
  #crop-overlay {
    position: absolute; inset: 0; cursor: ns-resize;
    display: none; z-index: 10;
    background: transparent;
  }
  #crop-overlay.active { display: block; }
  #crop-hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-family: 'Jost', sans-serif; font-size: 9px; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(245,243,240,0.55);
    background: rgba(0,0,0,0.45); padding: 4px 10px; border-radius: 10px;
    pointer-events: none; white-space: nowrap;
  }
  /* visual drag bar */
  #crop-dragbar {
    position: absolute; left: 0; right: 0; height: 2px;
    background: rgba(245,243,240,0.6); pointer-events: none;
    box-shadow: 0 0 6px rgba(255,255,255,0.4);
  }

  canvas#exportCanvas { display: none; }

  /* ── Slide items (carousel list) ── */
  .slide-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px;
    border-radius: 3px; cursor: pointer;
    background: rgba(245,243,240,0.04);
    border: 1px solid rgba(245,243,240,0.1);
    color: var(--mist);
    transition: all 0.15s;
  }

  .slide-item.active {
    background: rgba(97,78,58,0.25);
    border-color: var(--walnut);
    color: var(--cream);
  }

  body.light-theme .slide-item {
    background: rgba(17,17,17,0.03);
    border-color: rgba(17,17,17,0.08);
    color: var(--mist);
  }

  body.light-theme .slide-item.active {
    background: rgba(97,78,58,0.12);
    border-color: var(--walnut);
    color: var(--walnut);
  }
</style>
</head>
<body>

<header>
  <span class="logo">Bon Studio</span>
  <span class="subtitle">Content Compositor</span>
  <span class="version">v3.3</span>
  <div class="theme-toggle">
    <input type="checkbox" class="checkbox" id="themeCheckbox" onchange="toggleTheme()">
    <label for="themeCheckbox" class="checkbox-label">
      <span class="toggle-icon">☾</span>
      <span class="toggle-icon">☀</span>
      <span class="ball"></span>
    </label>
  </div>
</header>

<div class="app">

<!-- ══════════════ SIDEBAR ══════════════ -->
<aside class="sidebar">

  <!-- PHOTO -->
  <div>
    <div class="section-label">Photo</div>
    <label class="upload-zone" id="uploadZone" for="photoInput">
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
      <div class="upload-icon">↑</div>
      <p>Drop photo here or click anywhere to upload</p>
      <div class="file-name" id="fileName"></div>
    </label>
  </div>

  <!-- FORMAT -->
  <div>
    <div class="section-label">Format</div>
    <div class="format-row">
      <button class="format-btn active" onclick="setFormat('square',this)">
        <span class="ratio">1:1</span>Feed Square
      </button>
      <button class="format-btn" onclick="setFormat('portrait',this)">
        <span class="ratio">4:5</span>Feed Portrait
      </button>
      <button class="format-btn" onclick="setFormat('story',this)">
        <span class="ratio">9:16</span>Story / Reel
      </button>
    </div>
  </div>

  <!-- TEXT POSITION — 3×2 grid -->
  <div>
    <div class="section-label">Text Position</div>
    <div class="layout-grid">

      <button class="layout-btn active" onclick="setLayout('top-left',this)">
        <div class="thumb">
          <div class="tl" style="left:14%;top:18%;width:52%;height:3px;"></div>
          <div class="tl" style="left:14%;top:28%;width:38%;height:2px;"></div>
        </div>Top Left
      </button>

      <button class="layout-btn" onclick="setLayout('top-center',this)">
        <div class="thumb">
          <div class="tl" style="left:24%;top:18%;width:52%;height:3px;"></div>
          <div class="tl" style="left:30%;top:28%;width:40%;height:2px;"></div>
        </div>Top Center
      </button>

      <button class="layout-btn" onclick="setLayout('top-right',this)">
        <div class="thumb">
          <div class="tl" style="right:14%;top:18%;width:52%;height:3px;"></div>
          <div class="tl" style="right:14%;top:28%;width:38%;height:2px;"></div>
        </div>Top Right
      </button>

      <button class="layout-btn" onclick="setLayout('center-left',this)">
        <div class="thumb">
          <div class="tl" style="left:14%;top:40%;width:52%;height:3px;"></div>
          <div class="tl" style="left:14%;top:50%;width:38%;height:2px;"></div>
        </div>Mid Left

<script>
// ═══════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════
const LS_KEY = 'bonstudio_compositor_v3';

let currentFormat  = 'square';
let currentLayout  = 'top-left';
let currentFontStyle = 'italiana';
let currentTextColor = '#FFFFFF';
let currentSlideIndex = 0;
let wmDataUrl      = null;
let wmPos          = 'center';
let wmSize         = 18;
let textScale      = 100;
let lineHeightVal  = 1.3;
let letterSpacingVal = 0;
let rotationVal    = 0;
let currentTheme   = 'dark';
let subtextItalic  = true;
let headlineOpacity = 100;
let subtextOpacity  = 100;

const FORMAT_DIMS = {
  square:   { w: 1080, h: 1080 },
  portrait: { w: 1080, h: 1350 },
  story:    { w: 1080, h: 1920 }
};

const FORMAT_PREVIEW_H = { square: '500px', portrait: '625px', story: '889px' };

const FONT_STYLES = {
  italiana: { family: "'Italiana', serif", fontWeight: 400 },
  bellaurore: { family: "'La Belle Aurore', cursive", fontWeight: 400 },
  bilbo: { family: "'Bilbo Swash Caps', cursive", fontWeight: 400 },
  bodoni: { family: "'Bodoni Moda', serif", fontWeight: 400 }
};

let slides = [{
  photo: null, eyebrow: '', headline: 'Every Story', subtext: '', caption: '',
  layout: 'top-left', fontStyle: 'italiana', textColor: '#FFFFFF',
  cropOffsetY: 50
}];

// ═══════════════════════════════════════════════════
//  THEME TOGGLE
// ═══════════════════════════════════════════════════
function toggleTheme() {
  const checkbox = document.getElementById('themeCheckbox');
  currentTheme = checkbox.checked ? 'light' : 'dark';
  applyTheme();
  saveState();
}

function applyTheme() {
  const body = document.body;
  const checkbox = document.getElementById('themeCheckbox');
  if (currentTheme === 'light') {
    body.classList.add('light-theme');
    checkbox.checked = true;
  } else {
    body.classList.remove('light-theme');
    checkbox.checked = false;
  }
}

// ═══════════════════════════════════════════════════
//  LOCALSTORAGE — SAVE / LOAD
// ═══════════════════════════════════════════════════
function saveState() {
  try {
    const state = {
      currentFormat, currentLayout, currentFontStyle, currentTextColor,
      currentSlideIndex, wmPos, wmSize, textScale, lineHeightVal, letterSpacingVal, rotationVal,
      currentTheme, wmDataUrl, subtextItalic, headlineOpacity, subtextOpacity, aiDetectEnabled,
      slides: slides.map(s => ({ ...s, photo: s.photo || null }))
    };
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch(e) {
    console.warn('localStorage save failed:', e.message);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const state = JSON.parse(raw);

    currentFormat = state.currentFormat || 'square';
    currentLayout = state.currentLayout || 'top-left';
    currentFontStyle = state.currentFontStyle || 'italiana';
    currentTextColor = state.currentTextColor || '#FFFFFF';
    currentSlideIndex = state.currentSlideIndex || 0;
    wmPos = state.wmPos || 'center';
    wmSize = state.wmSize || 18;
    wmDataUrl = state.wmDataUrl || null;
    textScale = state.textScale || 100;
    lineHeightVal = state.lineHeightVal || 1.3;
    letterSpacingVal = state.letterSpacingVal || 0;
    rotationVal = state.rotationVal || 0;
    currentTheme = state.currentTheme || 'dark';
    aiDetectEnabled = state.aiDetectEnabled || false;
    subtextItalic = state.subtextItalic !== undefined ? state.subtextItalic : true;
    headlineOpacity = state.headlineOpacity !== undefined ? state.headlineOpacity : 100;
    subtextOpacity = state.subtextOpacity !== undefined ? state.subtextOpacity : 100;
    slides = state.slides || slides;
    slides = slides.map(s => ({ cropOffsetY: 50, ...s }));

    return true;
  } catch(e) {
    return false;
  }
}

// ═══════════════════════════════════════════════════
//  FORMAT
// ═══════════════════════════════════════════════════
function setFormat(fmt, btn) {
  currentFormat = fmt;
  document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
  saveState();
}

// ═══════════════════════════════════════════════════
//  LAYOUT
// ═══════════════════════════════════════════════════
function setLayout(layout, btn) {
  currentLayout = layout;
  slides[currentSlideIndex].layout = layout;
  document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
  saveState();
}

// ═══════════════════════════════════════════════════
//  FONT STYLE
// ═══════════════════════════════════════════════════
function setFontStyle(style, btn) {
  currentFontStyle = style;
  slides[currentSlideIndex].fontStyle = style;
  document.querySelectorAll('.font-style-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
  saveState();
}

// ═══════════════════════════════════════════════════
//  TEXT COLOR
// ═══════════════════════════════════════════════════
function setTextColor(color, el) {
  currentTextColor = color;
  slides[currentSlideIndex].textColor = color;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  updatePreview();
  saveState();
}

// ═══════════════════════════════════════════════════
//  PHOTO UPLOAD
// ═══════════════════════════════════════════════════
document.getElementById('photoInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  readImage(file, dataUrl => {
    slides[currentSlideIndex].photo = dataUrl;
    slides[currentSlideIndex].cropOffsetY = 50;
    delete segMaskData[currentSlideIndex];
    document.getElementById('fileName').textContent = file.name;
    updatePreview();
    saveState();
    if (aiDetectEnabled) runSegmentation();
  });
});

const uz = document.getElementById('uploadZone');
uz.addEventListener('dragover', e => { e.preventDefault(); uz.classList.add('drag-over'); });
uz.addEventListener('dragleave', () => uz.classList.remove('drag-over'));
uz.addEventListener('drop', e => {
  e.preventDefault(); uz.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  readImage(file, dataUrl => {
    slides[currentSlideIndex].photo = dataUrl;
    slides[currentSlideIndex].cropOffsetY = 50;
    delete segMaskData[currentSlideIndex];
    document.getElementById('fileName').textContent = file.name;
    updatePreview();
    saveState();
    if (aiDetectEnabled) runSegmentation();
  });
});

function readImage(file, cb) {
  const reader = new FileReader();
  reader.onload = ev => cb(ev.target.result);
  reader.readAsDataURL(file);
}

// ═══════════════════════════════════════════════════
//  WATERMARK
// ═══════════════════════════════════════════════════
document.getElementById('wmInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  readImage(file, dataUrl => {
    wmDataUrl = dataUrl;
    document.getElementById('wmBtnLabel').textContent = file.name.slice(0, 18) + (file.name.length > 18 ? '…' : '');
    renderWmPreview();
    updatePreview();
    saveState();
  });
});

function renderWmPreview() {
  const box = document.getElementById('wmPreviewBox');
  if (wmDataUrl) {
    box.innerHTML = `<img src="${wmDataUrl}" style="max-width:100%;max-height:100%;object-fit:contain;">`;
  } else {
    box.innerHTML = `<span style="font-size:9px;color:var(--mist);">—</span>`;
  }
}

function clearWatermark() {
  wmDataUrl = null;
  document.getElementById('wmBtnLabel').textContent = '↑ Upload PNG';
  document.getElementById('wmInput').value = '';
  renderWmPreview();
  updatePreview();
  saveState();
}

function setWmPos(pos, btn) {
  wmPos = pos;
  document.querySelectorAll('.wm-pos-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updatePreview();
  saveState();
}

function updateWmSize() {
  wmSize = parseInt(document.getElementById('wmSize').value);
  document.getElementById('wmSizeVal').textContent = wmSize + '%';
  updatePreview();
  saveState();
}

// ═══════════════════════════════════════════════════
//  TEXT ADJUSTMENTS
// ═══════════════════════════════════════════════════
function updateTextScale() {
  textScale = parseInt(document.getElementById('textScale').value);
  document.getElementById('textScaleVal').textContent = textScale + '%';
  updatePreview();
  saveState();
}

function updateLineHeight() {
  lineHeightVal = parseFloat(document.getElementById('lineHeight').value);
  document.getElementById('lineHeightVal').textContent = lineHeightVal.toFixed(1);
  updatePreview();
  saveState();
}

function updateLetterSpacing() {
  letterSpacingVal = parseFloat(document.getElementById('letterSpacing').value);
  document.getElementById('letterSpacingVal').textContent = letterSpacingVal + 'px';
  updatePreview();
  saveState();
}

function updateRotation() {
  rotationVal = parseInt(document.getElementById('textRotation').value);
  document.getElementById('rotationVal').textContent = rotationVal + '°';
  updatePreview();
  saveState();
}

function setSubtextItalic(isItalic) {
  subtextItalic = isItalic;
  document.getElementById('subtextItalicBtn').classList.toggle('active', isItalic);
  document.getElementById('subtextRegularBtn').classList.toggle('active', !isItalic);
  updatePreview();
  saveState();
}

function updateHeadlineOpacity() {
  headlineOpacity = parseInt(document.getElementById('headlineOpacity').value);
  document.getElementById('headlineOpacityVal').textContent = headlineOpacity + '%';
  updatePreview();
  saveState();
}

function updateSubtextOpacity() {
  subtextOpacity = parseInt(document.getElementById('subtextOpacity').value);
  document.getElementById('subtextOpacityVal').textContent = subtextOpacity + '%';
  updatePreview();
  saveState();
}

// ═══════════════════════════════════════════════════
//  LIVE PREVIEW
// ═══════════════════════════════════════════════════
// Preview display size: keep the long edge around this many CSS px
const PREVIEW_MAX = 560;

function getPreviewDisplaySize(w, h) {
  const ratio = h / w;
  // width is the short edge for portrait/story, so scale by the tallest dim
  let dispW, dispH;
  if (h >= w) { dispH = PREVIEW_MAX; dispW = PREVIEW_MAX / ratio; }
  else        { dispW = PREVIEW_MAX; dispH = PREVIEW_MAX * ratio; }
  return { dispW: Math.round(dispW), dispH: Math.round(dispH) };
}

let _renderToken = 0;
async function updatePreview() {
  const myToken = ++_renderToken;
  const slide = currentSlide();

  // Sync inputs → slide state
  slide.eyebrow  = document.getElementById('eyebrow').value;
  slide.headline = document.getElementById('headline').value;
  slide.subtext  = document.getElementById('subtext').value;
  slide.caption  = document.getElementById('caption').value;
  slide.layout   = currentLayout;
  slide.fontStyle = currentFontStyle;
  slide.textColor = currentTextColor;

  const { w, h } = FORMAT_DIMS[currentFormat];
  const canvas = document.getElementById('preview');
  const { dispW, dispH } = getPreviewDisplaySize(w, h);

  // Load all async resources FIRST (before touching the visible canvas),
  // so rapid calls don't leave a half-drawn frame.
  let img = null;
  if (slide.photo) { try { img = await getImage(slide.photo); } catch(e) { img = null; } }
  await document.fonts.ready;
  let wmImg = null;
  if (wmDataUrl) { try { wmImg = await getImage(wmDataUrl); } catch(e){} }

  // If a newer render started while we were awaiting, abandon this one.
  if (myToken !== _renderToken) return;

  // Internal resolution = FULL export size → identical math to export
  canvas.width = w;
  canvas.height = h;
  canvas.style.width  = dispW + 'px';
  canvas.style.height = dispH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);

  // 1. Background
  if (img) {
    drawPhotoBg(ctx, w, h, img, slide.cropOffsetY);
  } else {
    ctx.fillStyle = '#3A3530';
    ctx.fillRect(0, 0, w, h);
  }

  // 2. Foreground (text-behind-subject)
  let fgInfo = null;
  if (aiDetectEnabled && segMaskData[currentSlideIndex] && img) {
    fgInfo = { canvas: buildForegroundCanvas(w, h, img, slide.cropOffsetY, segMaskData[currentSlideIndex]) };
  }

  // 3. Draw text + wm + fg via the SAME function as export
  drawComposition(ctx, w, h, slide, wmImg, fgInfo);

  // 4. Crop drag bar position + overlay visibility
  const overlay = document.getElementById('crop-overlay');
  if (slide.photo) {
    overlay.classList.add('active');
    const barY = ((slide.cropOffsetY ?? 50) / 100) * dispH;
    document.getElementById('crop-dragbar').style.top = barY + 'px';
  } else {
    overlay.classList.remove('active');
  }
}

// ═══════════════════════════════════════════════════
//  CROP DRAG
// ═══════════════════════════════════════════════════
(function() {
  let dragging = false;
  let dragStartY = 0;
  let dragStartOffset = 50;
  const overlay = document.getElementById('crop-overlay');

  overlay.addEventListener('mousedown', e => {
    if (!slides[currentSlideIndex].photo) return;
    dragging = true;
    dragStartY = e.clientY;
    dragStartOffset = slides[currentSlideIndex].cropOffsetY ?? 50;
    overlay.style.cursor = 'ns-resize';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const canvas = document.getElementById('preview');
    const previewH = canvas.getBoundingClientRect().height;
    const deltaY = e.clientY - dragStartY;
    const deltaPct = (deltaY / previewH) * 100;
    let newOffset = dragStartOffset - deltaPct;
    newOffset = Math.max(0, Math.min(100, newOffset));
    slides[currentSlideIndex].cropOffsetY = newOffset;
    updatePreview();
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    overlay.style.cursor = 'ns-resize';
    saveState();
  });

  overlay.addEventListener('touchstart', e => {
    if (!slides[currentSlideIndex].photo) return;
    dragging = true;
    dragStartY = e.touches[0].clientY;
    dragStartOffset = slides[currentSlideIndex].cropOffsetY ?? 50;
    e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const canvas = document.getElementById('preview');
    const previewH = canvas.getBoundingClientRect().height;
    const deltaY = e.touches[0].clientY - dragStartY;
    const deltaPct = (deltaY / previewH) * 100;
    let newOffset = dragStartOffset - deltaPct;
    newOffset = Math.max(0, Math.min(100, newOffset));
    slides[currentSlideIndex].cropOffsetY = newOffset;
    updatePreview();
  }, { passive: false });

  document.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    saveState();
  });
})();

// ═══════════════════════════════════════════════════
//  CAROUSEL
// ═══════════════════════════════════════════════════
function currentSlide() { return slides[currentSlideIndex]; }

function renderSlideList() {
  const list = document.getElementById('slideList');
  list.innerHTML = slides.map((s, i) => `
    <div onclick="goToSlide(${i})" class="slide-item ${i===currentSlideIndex?'active':''}">
      <span style="font-size:9px;letter-spacing:0.12em;font-weight:500;min-width:16px;">0${i+1}</span>
      <span style="font-size:12px;font-family:Italiana,serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">${s.headline || '—'}</span>
      ${s.photo ? '<span style="font-size:9px;color:#614E3A;">●</span>' : ''}
    </div>
  `).join('');

  const dots = document.getElementById('slideDots');
  dots.innerHTML = slides.map((_,i) => `<button class="slide-dot ${i===currentSlideIndex?'active':''}" onclick="goToSlide(${i})"></button>`).join('');

  document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
  document.getElementById('nextBtn').disabled = currentSlideIndex === slides.length - 1;
  document.getElementById('slideInfo').textContent = `Slide ${currentSlideIndex+1} of ${slides.length}`;
}

function loadSlide(index) {
  const s = slides[index];
  document.getElementById('eyebrow').value  = s.eyebrow  || '';
  document.getElementById('headline').value = s.headline || '';
  document.getElementById('subtext').value  = s.subtext  || '';
  document.getElementById('caption').value  = s.caption  || '';

  currentLayout   = s.layout   || 'top-left';
  currentFontStyle = s.fontStyle || 'italiana';
  currentTextColor = s.textColor || '#FFFFFF';

  // Sync buttons
  document.querySelectorAll('.layout-btn').forEach(b => {
    const lyt = b.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    b.classList.toggle('active', lyt === currentLayout);
  });
  document.querySelectorAll('.font-style-tab').forEach(b => {
    const fs = b.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    b.classList.toggle('active', fs === currentFontStyle);
  });
  document.querySelectorAll('.color-swatch').forEach(b => {
    const tc = b.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    b.classList.toggle('active', tc === currentTextColor);
  });

  document.getElementById('fileName').textContent = s.photo ? '(photo loaded)' : '';
  updatePreview();
  renderSlideList();
}

function goToSlide(i)  { currentSlideIndex = i; loadSlide(i); saveState(); }
function prevSlide()   { if (currentSlideIndex > 0) goToSlide(currentSlideIndex - 1); }
function nextSlide()   { if (currentSlideIndex < slides.length - 1) goToSlide(currentSlideIndex + 1); }

function addSlide() {
  const cur = slides[currentSlideIndex];
  slides.push({
    photo:   null,
    eyebrow: cur.eyebrow,
    headline: cur.headline,
    subtext:  cur.subtext,
    caption:  cur.caption,
    layout:   cur.layout,
    fontStyle: cur.fontStyle,
    textColor: cur.textColor,
    cropOffsetY: 50
  });
  goToSlide(slides.length - 1);
}

function removeSlide() {
  if (slides.length <= 1) return;
  slides.splice(currentSlideIndex, 1);
  if (currentSlideIndex >= slides.length) currentSlideIndex = slides.length - 1;
  loadSlide(currentSlideIndex);
  saveState();
}

// ═══════════════════════════════════════════════════
//  EXPORT — CANVAS RENDERER
// ═══════════════════════════════════════════════════
// ═══════════════════════════════════════════════════
//  SHARED COMPOSITION RENDERER — single source of truth
//  Used by BOTH the live preview and the export.
//  Draws at the given canvas resolution (w × h). Because every size is
//  derived from w, the preview (full-res, scaled down via CSS) and the
//  export are guaranteed identical.
// ═══════════════════════════════════════════════════

// Image cache so we don't reload the same dataURL repeatedly
const _imgCache = {};
function getImage(src) {
  return new Promise((resolve, reject) => {
    if (_imgCache[src] && _imgCache[src].complete) { resolve(_imgCache[src]); return; }
    const img = new Image();
    img.onload = () => { _imgCache[src] = img; resolve(img); };
    img.onerror = reject;
    img.src = src;
  });
}

// Draw photo background with crop offset
function drawPhotoBg(ctx, w, h, img, cropOffsetY) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const scale = Math.max(w/iw, h/ih);
  const dw = iw*scale, dh = ih*scale;
  const offsetPct = (cropOffsetY ?? 50) / 100;
  const excessY = dh - h;
  const excessX = dw - w;
  const dx = -excessX / 2;
  const dy = -(excessY * offsetPct);
  ctx.drawImage(img, dx, dy, dw, dh);
  return { dx, dy, dw, dh, scale, iw, ih };
}

// The text + watermark composition. ctx must already have the bg drawn.
// wmImg and fgImg may be null. Everything sized from w.
function drawComposition(ctx, w, h, slide, wmImg, fgInfo) {
  const fontStyle = FONT_STYLES[slide.fontStyle] || FONT_STYLES['italiana'];
  const textColor = slide.textColor || '#FFFFFF';

  const pad = w * 0.1;
  const ts = textScale / 100;
  const szEyebrow  = Math.round(w * 0.022 * ts);
  const szHeadline = Math.round(w * 0.11  * ts);
  const szSubtext  = Math.round(w * 0.028 * ts);
  const szCaption  = Math.round(w * 0.018);

  const capE  = szEyebrow  * 0.72;
  const descE = szEyebrow  * 0.20;
  const capH  = szHeadline * 0.75;
  const descH = szHeadline * 0.15;
  const capS  = szSubtext  * 0.72;
  const descS = szSubtext  * 0.20;
  const gap   = Math.round(w * 0.020);

  const advEtoH = descE + gap + capH;
  const advHtoS = descH + gap + capS;

  const hlLines  = slide.headline ? slide.headline.split('/').map(l => l.trim()) : [];
  const subLines = slide.subtext  ? slide.subtext.split('/').map(l => l.trim())  : [];
  const lineH    = szHeadline * lineHeightVal;
  const subLineH = szSubtext  * lineHeightVal;

  // Total block height for vertical centering
  let blockH = 0;
  if (slide.eyebrow)  blockH += capE;
  if (slide.eyebrow && slide.headline)  blockH += advEtoH;
  else if (slide.headline)              blockH += capH;
  blockH += (hlLines.length - 1) * lineH;            // extra headline lines
  if (slide.headline && slide.subtext)  blockH += advHtoS;
  else if (slide.subtext && !slide.headline) blockH += capS;
  blockH += (subLines.length - 1) * subLineH;        // extra subtext lines
  blockH += descS;

  const layout = slide.layout || 'top-left';
  let startX, startY, align;
  const centerStartY = (h - blockH) / 2 + capE;
  const topStartY    = h * 0.14 + capE;

  if      (layout === 'top-left')     { startX = pad;     startY = topStartY;    align = 'left';   }
  else if (layout === 'top-center')   { startX = w/2;     startY = topStartY;    align = 'center'; }
  else if (layout === 'top-right')    { startX = w - pad; startY = topStartY;    align = 'right';  }
  else if (layout === 'center-left')  { startX = pad;     startY = centerStartY; align = 'left';   }
  else if (layout === 'center')       { startX = w/2;     startY = centerStartY; align = 'center'; }
  else if (layout === 'center-right') { startX = w - pad; startY = centerStartY; align = 'right';  }
  else                                { startX = pad;     startY = topStartY;    align = 'left';   }

  ctx.save();
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';

  // Rotation around the text anchor (matches a single rotate of the block)
  if (rotationVal !== 0) {
    ctx.translate(startX, startY);
    ctx.rotate(rotationVal * Math.PI / 180);
    ctx.translate(-startX, -startY);
  }

  // letter spacing (supported on modern canvas); applies to all text
  const lsPx = (letterSpacingVal || 0);

  let y = startY;

  // EYEBROW
  if (slide.eyebrow) {
    ctx.shadowColor = 'rgba(0,0,0,0.22)'; ctx.shadowBlur = w * 0.016;
    ctx.font = `300 ${szEyebrow}px 'Jost', sans-serif`;
    ctx.fillStyle = textColor;
    try { ctx.letterSpacing = (Math.round(w * 0.003) + lsPx) + 'px'; } catch(e){}
    ctx.globalAlpha = 1.0;
    ctx.fillText(slide.eyebrow.toUpperCase(), startX, y);
    try { ctx.letterSpacing = '0px'; } catch(e){}
    if (slide.headline) y += advEtoH;
  }

  // HEADLINE (multi-line)
  if (slide.headline) {
    ctx.shadowColor = 'rgba(0,0,0,0.22)'; ctx.shadowBlur = w * 0.016;
    ctx.font = `${fontStyle.fontWeight} ${szHeadline}px ${fontStyle.family}`;
    ctx.fillStyle = textColor;
    try { ctx.letterSpacing = lsPx + 'px'; } catch(e){}
    ctx.globalAlpha = headlineOpacity / 100;
    hlLines.forEach((line, idx) => {
      ctx.fillText(line, startX, y + (idx * lineH));
    });
    ctx.globalAlpha = 1.0;
    try { ctx.letterSpacing = '0px'; } catch(e){}
    if (slide.subtext) y += advHtoS + (hlLines.length - 1) * lineH;
  }

  // SUBTEXT (multi-line)
  if (slide.subtext) {
    ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
    const italicStr = subtextItalic ? 'italic ' : '';
    ctx.font = `300 ${italicStr}${szSubtext}px 'Jost', sans-serif`;
    ctx.fillStyle = textColor;
    try { ctx.letterSpacing = lsPx + 'px'; } catch(e){}
    ctx.globalAlpha = subtextOpacity / 100;
    subLines.forEach((line, idx) => {
      ctx.fillText(line, startX, y + (idx * subLineH));
    });
    ctx.globalAlpha = 1.0;
    try { ctx.letterSpacing = '0px'; } catch(e){}
  }

  ctx.restore();

  // CAPTION (bottom, never rotated/scaled)
  ctx.save();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  if (slide.caption) {
    ctx.font = `300 ${szCaption}px 'DM Sans', sans-serif`;
    ctx.fillStyle = textColor;
    const capX = align === 'right' ? w - pad : pad;
    ctx.textAlign = align === 'right' ? 'right' : 'left';
    ctx.fillText(slide.caption, capX, h - h*0.07);
  }
  ctx.restore();

  // TEXT-BEHIND-SUBJECT: redraw the masked person foreground OVER the text
  if (fgInfo && fgInfo.canvas) {
    ctx.drawImage(fgInfo.canvas, 0, 0, w, h);
  }

  // WATERMARK (always on top)
  if (wmImg) {
    const wmW  = w * wmSize / 100;
    const wmH  = wmImg.naturalHeight * (wmW / wmImg.naturalWidth);
    const wmY  = h - wmH - h * 0.03;
    let wmX;
    if      (wmPos === 'left')   wmX = w * 0.05;
    else if (wmPos === 'right')  wmX = w - wmW - w * 0.05;
    else                         wmX = (w - wmW) / 2;
    ctx.globalAlpha = 0.75;
    ctx.drawImage(wmImg, wmX, wmY, wmW, wmH);
    ctx.globalAlpha = 1.0;
  }
}

// Build a masked-foreground canvas (person only, bg transparent) at w×h
function buildForegroundCanvas(w, h, img, cropOffsetY, maskInfo) {
  const fg = document.createElement('canvas');
  fg.width = w; fg.height = h;
  const fctx = fg.getContext('2d');
  const geo = drawPhotoBg(fctx, w, h, img, cropOffsetY);
  const { dx, dy, scale, iw, ih } = geo;
  const imgData = fctx.getImageData(0, 0, w, h);
  const px = imgData.data;
  const { mask, w: mw, h: mh } = maskInfo;
  for (let yy = 0; yy < h; yy++) {
    for (let xx = 0; xx < w; xx++) {
      const origX = (xx - dx) / scale;
      const origY = (yy - dy) / scale;
      const mx = Math.round(origX * mw / iw);
      const my = Math.round(origY * mh / ih);
      let isPerson = 0;
      if (mx >= 0 && mx < mw && my >= 0 && my < mh) isPerson = mask[my * mw + mx];
      if (!isPerson) px[(yy * w + xx) * 4 + 3] = 0;
    }
  }
  fctx.putImageData(imgData, 0, 0);
  return fg;
}

// ═══════════════════════════════════════════════════
//  EXPORT RENDERER — uses the shared drawComposition()
// ═══════════════════════════════════════════════════
async function renderSlideToCanvas(slideIndex) {
  const slide      = slides[slideIndex];
  const { w, h }   = FORMAT_DIMS[currentFormat];
  const canvas     = document.getElementById('exportCanvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');

  // 1. Background
  let img = null;
  if (slide.photo) {
    img = await getImage(slide.photo);
    drawPhotoBg(ctx, w, h, img, slide.cropOffsetY);
  } else {
    ctx.fillStyle = '#3A3530';
    ctx.fillRect(0,0,w,h);
  }

  await document.fonts.ready;

  // 2. Foreground (text-behind-subject) if enabled
  let fgInfo = null;
  if (aiDetectEnabled && segMaskData[slideIndex] && img) {
    fgInfo = { canvas: buildForegroundCanvas(w, h, img, slide.cropOffsetY, segMaskData[slideIndex]) };
  }

  // 3. Watermark image
  let wmImg = null;
  if (wmDataUrl) wmImg = await getImage(wmDataUrl);

  // 4. Draw everything via shared renderer
  drawComposition(ctx, w, h, slide, wmImg, fgInfo);

  return canvas.toDataURL('image/png');
}

// ═══════════════════════════════════════════════════
//  EXPORT ACTIONS
// ═══════════════════════════════════════════════════
async function exportCurrentSlide() {
  setStatus('Rendering…');
  try {
    const dataUrl = await renderSlideToCanvas(currentSlideIndex);
    dl(dataUrl, `bonstudio-slide-${currentSlideIndex+1}-${currentFormat}.png`);
    setStatus(`Exported slide ${currentSlideIndex+1} ✦`, 3000);
  } catch(e) { console.error(e); setStatus('Export failed. See console.'); }
}

async function exportAll() {
  for (let i = 0; i < slides.length; i++) {
    setStatus(`Exporting ${i+1} of ${slides.length}…`);
    const dataUrl = await renderSlideToCanvas(i);
    dl(dataUrl, `bonstudio-slide-${i+1}-${currentFormat}.png`);
    await new Promise(r => setTimeout(r, 350));
  }
  setStatus(`All ${slides.length} slides exported ✦`, 4000);
}

function dl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl; a.download = filename; a.click();
}

function setStatus(msg, clearAfter) {
  const el = document.getElementById('exportStatus');
  el.textContent = msg;
  if (clearAfter) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, clearAfter);
}



// ═══════════════════════════════════════════════════
//  AI SUBJECT DETECTION — BodyPix Person Segmentation
// ═══════════════════════════════════════════════════
let aiDetectEnabled = false;
let bodyPixModel    = null;
let segMaskData     = {};  // slideIndex → { mask: Uint8Array (0 or 1), w, h }

function setAIStatus(msg) {
  const el = document.getElementById('aiStatus');
  if (el) el.textContent = msg;
}

function setAIProgress(pct) {
  const bar = document.getElementById('aiProgressBar');
  const wrap = document.getElementById('aiProgress');
  if (!bar || !wrap) return;
  if (pct < 0) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  bar.style.width = pct + '%';
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    // Check if already loaded
    const existing = document.querySelector('script[src="' + src + '"]');
    if (existing) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Failed to load: ' + src));
    document.body.appendChild(s);
  });
}

async function loadBodyPixModel() {
  if (bodyPixModel) return bodyPixModel;
  setAIStatus('Loading TensorFlow.js…');
  setAIProgress(20);
  try {
    // Step 1: Load TensorFlow.js
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js');
    setAIStatus('Loading BodyPix…');
    setAIProgress(40);

    // Step 2: Load BodyPix UMD (needs tf loaded first)
    await loadScript('https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.1/dist/body-pix.min.umd.js');
    setAIProgress(60);

    // Step 3: Verify bodyPix is available (UMD exports as window['body-pix'])
    const bp = window['body-pix'];
    if (!bp || typeof bp.load !== 'function') {
      throw new Error('body-pix module not found');
    }

    setAIStatus('Initializing model…');
    setAIProgress(75);

    // Step 4: Load the model
    bodyPixModel = await bp.load({
      architecture: 'MobileNetV1',
      outputStride: 16,
      multiplier: 0.5,
      quantBytes: 2
    });
    setAIProgress(100);
    setAIStatus('Model ready');
    setTimeout(() => { setAIProgress(-1); }, 800);
    return bodyPixModel;
  } catch(e) {
    setAIStatus('Error: ' + e.message);
    setAIProgress(-1);
    console.error('BodyPix load error:', e);
    return null;
  }
}

async function runSegmentation() {
  const slide = slides[currentSlideIndex];
  if (!slide.photo) {
    setAIStatus('Upload a photo first.');
    return;
  }

  const model = await loadBodyPixModel();
  if (!model) return;

  setAIStatus('Detecting person…');
  setAIProgress(60);

  // Load image into an HTMLImageElement
  const img = new Image();
  await new Promise((resolve) => {
    img.onload = resolve;
    img.onerror = resolve;
    img.src = slide.photo;
  });

  try {
    // Run person segmentation
    const segmentation = await model.segmentPerson(img, {
      flipHorizontal: false,
      internalResolution: 'medium',
      segmentationThreshold: 0.55
    });

    // segmentation.data is a Uint8Array where 1=person, 0=background
    segMaskData[currentSlideIndex] = {
      mask: segmentation.data,
      w: segmentation.width,
      h: segmentation.height
    };

    setAIProgress(100);
    setAIStatus('Person detected ✦');
    setTimeout(() => { setAIProgress(-1); }, 800);
    updatePreview();
  } catch(e) {
    setAIStatus('Detection failed: ' + e.message);
    setAIProgress(-1);
    console.error('Segmentation error:', e);
  }
}

// Foreground is now drawn inside updatePreview() via buildForegroundCanvas().
function renderForegroundLayer() { updatePreview(); }

async function toggleAIDetect() {
  aiDetectEnabled = document.getElementById('aiDetectToggle').checked;
  if (aiDetectEnabled) {
    if (!segMaskData[currentSlideIndex]) {
      await runSegmentation();
    } else {
      updatePreview();
    }
  } else {
    setAIStatus('');
    updatePreview();
  }
  saveState();
}

// ═══════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════
function init() {
  const restored = loadState();

  if (wmDataUrl) {
    renderWmPreview();
    document.getElementById('wmBtnLabel').textContent = 'Watermark loaded';
  }

  document.querySelectorAll('.wm-pos-btn').forEach(b => {
    const p = b.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    b.classList.toggle('active', p === wmPos);
  });

  document.getElementById('wmSize').value = wmSize;
  document.getElementById('wmSizeVal').textContent = wmSize + '%';

  document.getElementById('textScale').value = textScale;
  document.getElementById('textScaleVal').textContent = textScale + '%';

  document.getElementById('lineHeight').value = lineHeightVal;
  document.getElementById('lineHeightVal').textContent = lineHeightVal.toFixed(1);

  document.getElementById('letterSpacing').value = letterSpacingVal;
  document.getElementById('letterSpacingVal').textContent = letterSpacingVal + 'px';

  document.getElementById('textRotation').value = rotationVal;
  document.getElementById('rotationVal').textContent = rotationVal + '°';

  // Restore italic toggle
  document.getElementById('subtextItalicBtn').classList.toggle('active', subtextItalic);
  document.getElementById('subtextRegularBtn').classList.toggle('active', !subtextItalic);

  // Restore opacity sliders
  document.getElementById('headlineOpacity').value = headlineOpacity;
  document.getElementById('headlineOpacityVal').textContent = headlineOpacity + '%';
  document.getElementById('subtextOpacity').value = subtextOpacity;
  document.getElementById('subtextOpacityVal').textContent = subtextOpacity + '%';

  // Restore AI detect toggle
  const aiCheck = document.getElementById('aiDetectToggle');
  if (aiCheck) aiCheck.checked = aiDetectEnabled;

  document.querySelectorAll('.format-btn').forEach(b => {
    const f = b.getAttribute('onclick').match(/'([^']+)'/)?.[1];
    b.classList.toggle('active', f === currentFormat);
  });

  applyTheme();

  if (currentSlideIndex >= slides.length) currentSlideIndex = 0;

  loadSlide(currentSlideIndex);
  renderSlideList();
}

init();
